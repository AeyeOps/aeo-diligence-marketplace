[project]
name = "code-diligence"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.43.115",
    "duckdb~=1.5.2",
    "git-of-theseus==0.3.4",
    "httpx~=0.28.1",
    "pydantic~=2.13.4",
    "pygit2~=1.19.2",
    "pygments==2.21.0",
    "pyyaml~=6.0.3",
    "rich~=15.0.0",
    "typer~=0.25.1",
    "wcmatch>=10",
]

[dependency-groups]
dev = [
    "pyright~=1.1.409",
    "pytest~=9.0.3",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.1.0",
    "pytest-httpx~=0.36.2",
    "ruff~=0.15.13",
]

[project.scripts]
code-diligence = "code_diligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.uv.workspace]
members = [
    "mcp/diligence-warehouse",
]
